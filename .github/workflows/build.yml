name: Build SEU Linux ISO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Build builder image
        run: docker build --platform linux/amd64 -t seu-builder .

      - name: Run builder container
        run: docker run --rm --privileged -v "$PWD":/src seu-builder /src/build.sh

      - uses: actions/upload-artifact@v4 
        with:
          name: seu-linux-iso
          path: out/seu-linux.iso
        